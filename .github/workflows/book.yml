name: Build book
on:
  pull_request:
  push:
    branches:
      - main
      - maintenance/build-reliability-docs
permissions:
  contents: read
concurrency:
  group: book-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  render:
    name: Render ${{ matrix.format }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        format: [html, pdf, epub]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-tinytex@v2
        if: matrix.format == 'pdf'
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
      - name: Render book
        run: Rscript scripts/build.R ${{ matrix.format }}
